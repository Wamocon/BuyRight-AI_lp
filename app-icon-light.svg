<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="App Icon – BuyRight-AI">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Shield glow layer -->
  <path d="M256 48 L416 112 L416 284 C416 388 344 454 256 480 C168 454 96 388 96 284 L96 112 Z"
    fill="url(#shieldGrad)" opacity="0.3" filter="url(#glow)"/>

  <!-- Shield body -->
  <path d="M256 48 L416 112 L416 284 C416 388 344 454 256 480 C168 454 96 388 96 284 L96 112 Z"
    fill="url(#shieldGrad)"/>

  <!-- Inner highlight -->
  <path d="M256 80 L392 136 L392 278 C392 370 330 430 256 452 C182 430 120 370 120 278 L120 136 Z"
    fill="white" opacity="0.07"/>

  <!-- Checkmark -->
  <path d="M160 258 L220 330 L360 198"
    fill="none" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Sparkle dots -->
  <circle cx="404" cy="100" r="16" fill="url(#sparkGrad)" opacity="0.9"/>
  <circle cx="436" cy="68" r="10" fill="url(#sparkGrad)" opacity="0.7"/>
  <circle cx="368" cy="66" r="10" fill="url(#sparkGrad)" opacity="0.7"/>
  <circle cx="428" cy="138" r="8" fill="url(#sparkGrad)" opacity="0.55"/>
</svg>
